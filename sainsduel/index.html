    // --- AUDIO ENGINE ---
    let audioCtx = null;
    const initAudio = () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    };
    const playTone = (freq, type, duration, vol = 0.1) => {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    };

            { q: "Alat untuk mengukur suhu adalah...", a: "Termometer", w: ["Barometer", "Anemometer"] },
            { q: "Benda yang dapat ditarik kuat oleh magnet terbuat dari...", a: "Besi", w: ["Plastik", "Karet"] },
            { q: "Bunyi pantul yang terdengar jelas setelah bunyi asli disebut...", a: "Gema", w: ["Gaung", "Desah"] },
            { q: "Perubahan wujud dari cair menjadi gas disebut...", a: "Menguap", w: ["Mencair", "Menyublim"] },
            { q: "Benda yang tidak dapat menghantarkan panas disebut...", a: "Isolator", w: ["Konduktor", "Radiator"] },
            { q: "Planet yang berwarna merah dalam tata surya adalah...", a: "Mars", w: ["Venus", "Yupiter"] },
            { q: "Cahaya matahari terdiri dari berapa warna utama?", a: "Tujuh", w: ["Tiga", "Lima"] },
            { q: "Alat pernapasan pada serangga adalah...", a: "Trakea", w: ["Insang", "Stomata"] },
            { q: "Katak dewasa bernapas menggunakan...", a: "Paru & Kulit", w: ["Insang", "Trakea"] },
            { q: "Hewan pemakan daging disebut...", a: "Karnivora", w: ["Herbivora", "Insektivora"] },
            { q: "Gaya yang terjadi karena dua permukaan bersentuhan adalah gaya...", a: "Gesek", w: ["Gravitasi", "Magnet"] }
        ],
        tier3: [
            { q: "Hubungan dua makhluk hidup yang saling menguntungkan disebut...", a: "Mutualisme", w: ["Parasitisme", "Komensalisme"] },
            { q: "Planet terbesar dalam tata surya kita adalah...", a: "Yupiter", w: ["Saturnus", "Uranus"] },
            { q: "Enzim pembunuh kuman pada lambung manusia adalah...", a: "Asam Klorida", w: ["Ptialin", "Pepsin"] },
            { q: "Penyakit akibat tubuh kekurangan sel darah merah disebut...", a: "Anemia", w: ["Leukemia", "Hemofilia"] },
            { q: "Logam cair yang biasa digunakan dalam termometer raksa adalah...", a: "Raksa", w: ["Alkohol", "Air"] },
            { q: "Perpindahan panas tanpa melalui zat perantara disebut...", a: "Radiasi", w: ["Konduksi", "Konveksi"] },
            { q: "Tumbuhan yang menangkap dan memakan serangga contohnya...", a: "Kantong Semar", w: ["Teratai", "Kaktus"] },
            { q: "Planet yang memiliki cincin paling indah dan terlihat jelas adalah...", a: "Saturnus", w: ["Neptunus", "Venus"] },
            { q: "Perputaran bumi mengelilingi matahari disebut...", a: "Revolusi", w: ["Rotasi", "Gerhana"] },
            { q: "Pembuluh darah yang membawa darah kaya oksigen dari jantung adalah...", a: "Arteri/Nadi", w: ["Vena/Balik", "Kapiler"] },
            { q: "Hewan berdarah dingin yang bisa hidup di darat dan di air...", a: "Amfibi", w: ["Reptil", "Mamalia"] },
            { q: "Tulang daun menyirip biasanya dimiliki oleh tumbuhan biji...", a: "Dikotil", w: ["Monokotil", "Spora"] }
        ]
    };

    const getScienceQuestion = (level) => {
        let pool = level <= 10 ? ipaQuestions.tier1 : (level <= 20 ? ipaQuestions.tier2 : ipaQuestions.tier3);
        const q = pool[Math.floor(Math.random() * pool.length)];
        let options = [q.a, ...q.w].sort(() => Math.random() - 0.5);
        return { text: q.q, answer: q.a, options };
    };

    const getQFontSize = t => t.length > 60 ? "text-2xl md:text-3xl" : (t.length > 40 ? "text-3xl md:text-4xl" : "text-4xl md:text-5xl");
    const getOptFontSize = t => t.length > 12 ? "text-sm md:text-base leading-tight" : (t.length > 8 ? "text-base md:text-lg leading-tight" : "text-xl md:text-2xl");

    // --- RENDERING & UI LOGIC ---
    function renderLevelGrid() {
        const grid = document.getElementById('level-grid');
        grid.innerHTML = '';
        for (let l = 1; l <= 30; l++) {
            const isSel = state.level === l;
            const cls = isSel ? 'bg-pink-500 border-pink-200 neon-text-red shadow-[0_0_15px_#f0f]' : 'bg-slate-700 border-slate-500 hover:border-green-400';
            grid.innerHTML += `<button data-lvl="${l}" class="py-2 text-lg font-bold rounded-lg border-2 transition-all ${cls} text-white">${l}</button>`;
        }
    }

    function switchScreen(screenId) {
        state.screen = screenId;
        ['menu', 'playing', 'gameover'].forEach(id => {
            document.getElementById(`screen-${id}`).classList.add('hidden');
            document.getElementById(`screen-${id}`).classList.remove('flex');
        });
        const active = document.getElementById(`screen-${screenId}`);
        active.classList.remove('hidden');
        active.classList.add('flex');

        if (screenId === 'menu') {
            renderLevelGrid();
        } else if (screenId === 'playing') {
            state.score1 = 0; state.score2 = 0;
            document.getElementById('score1').innerText = 0;
            document.getElementById('score2').innerText = 0;
            startCountdown(3);
        } else if (screenId === 'gameover') {
            state.matches++;
            document.getElementById('stat-played').innerText = `Matches: ${state.matches}`;
            const winner = state.score1 > state.score2 ? 'P1' : 'P2';
            const cls = state.score1 > state.score2 ? 'neon-text-blue text-cyan-400' : 'neon-text-red text-pink-500';
            const wEl = document.getElementById('winner-text');
            wEl.innerText = `${winner} WINS`;
            wEl.className = `text-7xl font-black mb-8 animate-bounce ${cls}`;
            document.getElementById('final-score1').innerText = state.score1;
            document.getElementById('final-score2').innerText = state.score2;
        }
    }

    function updateButtonClasses() {
        if (!state.questionData) return;
        const p1Btns = document.querySelectorAll('#p1-buttons button');
        const p2Btns = document.querySelectorAll('#p2-buttons button');
        
        state.questionData.options.forEach((opt, i) => {
            const b1 = p1Btns[i], b2 = p2Btns[i];
            const baseCls = `relative aspect-square w-24 md:w-32 rounded-[2rem] border-4 font-black transition-all flex items-center justify-center p-2 `;
            
            if (b1) {
                b1.disabled = state.p1Status !== 'active' || state.countdown !== null;
                const isCorrectP1 = state.p1Status === 'correct' && opt === state.questionData.answer;
                b1.className = baseCls + 
                    (state.p1Status === 'active' ? `bg-slate-800 border-cyan-400 text-cyan-100 neon-border-blue hover:bg-cyan-900 active:scale-90 ` : '') +
                    (isCorrectP1 ? `bg-cyan-500 border-white text-white shadow-[0_0_50px_#0ff] scale-110 z-20 ` : '') +
                    (state.p1Status === 'wrong' ? `bg-slate-900 border-slate-700 text-slate-700 opacity-50 ` : '');
            }
            if (b2) {
                b2.disabled = state.p2Status !== 'active' || state.countdown !== null;
                const isCorrectP2 = state.p2Status === 'correct' && opt === state.questionData.answer;
                b2.className = baseCls + 
                    (state.p2Status === 'active' ? `bg-slate-800 border-pink-500 text-pink-100 neon-border-red hover:bg-pink-900 active:scale-90 ` : '') +
                    (isCorrectP2 ? `bg-pink-500 border-white text-white shadow-[0_0_50px_#f0f] scale-110 z-20 ` : '') +
                    (state.p2Status === 'wrong' ? `bg-slate-900 border-slate-700 text-slate-700 opacity-50 ` : '');
            }
        });
    }

    function nextQuestion() {
        state.questionData = getScienceQuestion(state.level);
        state.p1Status = 'active'; state.p2Status = 'active';
        
        const qBox = document.getElementById('question-box');
        const qText = document.getElementById('question-text');
        document.getElementById('level-indicator').innerText = `LVL ${state.level}`;
        qText.innerText = state.questionData.text;
        qText.className = `font-black text-white neon-text-green tracking-tight ${getQFontSize(state.questionData.text)}`;
        
        qBox.classList.remove('animate-pop-in');
        void qBox.offsetWidth; // Reflow
        qBox.classList.add('animate-pop-in');

        const p1C = document.getElementById('p1-buttons'), p2C = document.getElementById('p2-buttons');
        p1C.innerHTML = ''; p2C.innerHTML = '';

        state.questionData.options.forEach((opt, i) => {
            p1C.innerHTML += `<div id="p1-wrap-${i}" class="relative"><button data-idx="${i}" class="..."><span class="transform rotate-90 inline-block drop-shadow-lg text-center ${getOptFontSize(opt)}">${opt}</span></button></div>`;
            p2C.innerHTML += `<div id="p2-wrap-${i}" class="relative"><button data-idx="${i}" class="..."><span class="transform -rotate-90 inline-block drop-shadow-lg text-center ${getOptFontSize(opt)}">${opt}</span></button></div>`;
        });
        updateButtonClasses();
    }

    function startCountdown(seconds) {
        state.countdown = seconds;
        const overlay = document.getElementById('overlay-countdown');
        const txt = document.getElementById('countdown-text');
        overlay.classList.remove('hidden');
        updateButtonClasses();

        function tick() {
            txt.classList.remove('animate-pop-in');
            void txt.offsetWidth;
            txt.classList.add('animate-pop-in');

            if (state.countdown > 0) {
                txt.innerText = state.countdown;
                if (state.countdown === 1) sounds.go(); else sounds.tick();
                state.countdown--;
                countdownTimer = setTimeout(tick, 800);
            } else if (state.countdown === 0) {
                txt.innerText = 'GO!';
                state.countdown--;
                countdownTimer = setTimeout(tick, 500);
            } else {
                overlay.classList.add('hidden');
                state.countdown = null;
                nextQuestion();
            }
        }
        if (countdownTimer) clearTimeout(countdownTimer);
        tick();
    }

    function triggerLightning() {
        sounds.zap();
        const ol = document.getElementById('overlay-lightning');
        ol.classList.remove('hidden'); ol.classList.add('animate-lightning');
        setTimeout(() => { ol.classList.add('hidden'); ol.classList.remove('animate-lightning'); }, 500);
    }

    function triggerExplosion(player, idx) {
        sounds.explosion();
        const wrap = document.getElementById(`p${player}-wrap-${idx}`);
        if (wrap) {
            const exp = document.createElement('div');
            exp.className = `absolute inset-0 rounded-full animate-explode pointer-events-none ${player === 1 ? 'border-cyan-300' : 'border-pink-400'}`;
            wrap.appendChild(exp);
            setTimeout(() => exp.remove(), 600);
        }
    }

    function handleAnswer(player, idx) {
        if (state.screen !== 'playing' || state.countdown !== null) return;
        if (player === 1 && state.p1Status !== 'active') return;
        if (player === 2 && state.p2Status !== 'active') return;

        initAudio();
        const selected = state.questionData.options[idx];

        if (selected === state.questionData.answer) {
            sounds.correct();
            triggerExplosion(player, idx);
            if (player === 1) { state.score1++; state.p1Status = 'correct'; state.p2Status = 'wrong'; }
            else { state.score2++; state.p2Status = 'correct'; state.p1Status = 'wrong'; }
            
            updateButtonClasses();
            document.getElementById('score1').innerText = state.score1;
            document.getElementById('score2').innerText = state.score2;

            if (state.score1 >= WIN_SCORE || state.score2 >= WIN_SCORE) {
                setTimeout(() => { sounds.win(); switchScreen('gameover'); }, 1000);
            } else {
                setTimeout(() => startCountdown(2), 500);
            }
        } else {
            triggerLightning();
            if (player === 1) state.p1Status = 'wrong';
            if (player === 2) state.p2Status = 'wrong';
            updateButtonClasses();
            if (state.p1Status === 'wrong' && state.p2Status === 'wrong') setTimeout(() => startCountdown(2), 500);
        }
    }

    // --- EVENTS LISENERS ---
    document.getElementById('level-grid').addEventListener('click', e => {
        const btn = e.target.closest('button');
        if (!btn) return;
        initAudio(); sounds.tick();
        state.level = parseInt(btn.dataset.lvl);
        renderLevelGrid();
    });

    document.getElementById('btn-start').addEventListener('click', () => { initAudio(); switchScreen('playing'); });
    document.getElementById('btn-restart').addEventListener('click', () => switchScreen('menu'));

    const attachGameClick = (pid) => {
        document.getElementById(`p${pid}-buttons`).addEventListener('click', e => {
            const btn = e.target.closest('button');
            if (btn && !btn.disabled) handleAnswer(pid, parseInt(btn.dataset.idx));
        });
    };
    attachGameClick(1); attachGameClick(2);

    // --- THEME & LANG (TATADADA) ---
    const htmlEl = document.documentElement;
    let isDark = localStorage.getItem('theme') === 'dark'; // TATADADA default Light
    function applyTheme() {
        if (isDark) htmlEl.classList.add('dark'); else htmlEl.classList.remove('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }
    applyTheme();
    document.getElementById('btn-theme').addEventListener('click', () => { isDark = !isDark; applyTheme(); });

    let lang = localStorage.getItem('lang') === 'en' ? 'en' : 'id';
    function applyLang() {
        document.getElementById('btn-lang').innerText = lang === 'en' ? '🇬🇧' : '🇮🇩';
        const d = i18n[lang];
        document.getElementById('btn-help').title = d.help;
        document.getElementById('lbl-level-select').innerText = d.level_select;
        document.getElementById('btn-start').innerText = d.start;
        document.getElementById('lbl-winner-title').innerText = d.winner;
        document.getElementById('btn-restart').innerText = d.play_again;
        document.getElementById('btn-terms').innerText = d.terms;
        document.getElementById('ui-subtitle').innerText = d.subtitle;
        document.getElementById('modal-title').innerText = d.terms + ' & Disclaimer';
        document.getElementById('term-context').innerText = d.term_ctx;
        document.getElementById('term-legal').innerText = d.term_lgl;
        localStorage.setItem('lang', lang);
    }
    applyLang();
    document.getElementById('btn-lang').addEventListener('click', () => { lang = lang === 'id' ? 'en' : 'id'; applyLang(); });
    document.getElementById('btn-help').addEventListener('click', () => alert(i18n[lang].help_text));

    // --- MODAL ---
    const modal = document.getElementById('modal-terms');
    const modalContent = document.getElementById('modal-content');
    document.getElementById('btn-terms').addEventListener('click', () => {
        modal.classList.remove('hidden'); modal.classList.add('flex');
        setTimeout(() => {
            modal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        }, 10);
    });
    document.getElementById('btn-close-modal').addEventListener('click', () => {
        modal.classList.add('opacity-0');
        modalContent.classList.remove('scale-100');
        modalContent.classList.add('scale-95');
        setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 300);
    });

    // INIT
    lucide.createIcons();
    renderLevelGrid();
</script>
</body>
</html>
