        function renderLucideIcons(root = document) {
            root.querySelectorAll('i[data-lucide]').forEach(el => {
                const name = el.getAttribute('data-lucide');
                const inner = LUCIDE_SVGS[name] || LUCIDE_SVGS['box'];
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('viewBox', '0 0 24 24');
                svg.setAttribute('fill', 'none');
                svg.setAttribute('stroke', 'currentColor');
                svg.setAttribute('stroke-width', '2');
                svg.setAttribute('stroke-linecap', 'round');
                svg.setAttribute('stroke-linejoin', 'round');
                svg.setAttribute('aria-hidden', 'true');
                if (el.className) svg.setAttribute('class', el.className);
                if (el.getAttribute('style')) svg.setAttribute('style', el.getAttribute('style'));
                svg.innerHTML = inner;
                el.replaceWith(svg);

        // =========================================================
        // 1. THREE.JS 3D SPACE ENGINE (Post-UI Idle + 30FPS Mobile Cap)
        // =========================================================
        let spaceInitialized = false;
        function initSpaceBackground() {
            if (spaceInitialized || typeof THREE === 'undefined') return;
            spaceInitialized = true;

            const canvas = document.getElementById('space-canvas');
            if (!canvas) return;
            const isMobile = window.innerWidth < 768;
            const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));

            const scene = new THREE.Scene();
            const isDark = document.documentElement.classList.contains('dark');
            scene.background = new THREE.Color(isDark ? 0x020205 : 0x070d1f);

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 20;

            const textureLoader = new THREE.TextureLoader();
            textureLoader.setCrossOrigin('anonymous');

            const loadOptimizedTexture = (rawUrl) => {
                const webpProxy = `https://wsrv.nl/?url=${encodeURIComponent(rawUrl)}&output=webp&w=1024&q=80`;
                const tex = textureLoader.load(webpProxy, undefined, undefined, () => {
                    textureLoader.load(rawUrl, (fallbackTex) => { tex.image = fallbackTex.image; tex.needsUpdate = true; });
                });
                return tex;
            };

            const earthGroup = new THREE.Group();
            scene.add(earthGroup);

            earthGroup.position.set(6, -4, -5);
            if (isMobile) earthGroup.position.set(0, -8, -10);

            const segs = isMobile ? 36 : 48;
            const earthGeo = new THREE.SphereGeometry(6, segs, segs);
            const earthMat = new THREE.MeshStandardMaterial({
                map: loadOptimizedTexture('https://unpkg.com/three-globe@2.45.6/example/img/earth-blue-marble.jpg'),
                bumpMap: loadOptimizedTexture('https://unpkg.com/three-globe@2.45.6/example/img/earth-topology.png'),
                bumpScale: 0.05,
                roughness: 0.6,
                metalness: 0.1
            });
            const earth = new THREE.Mesh(earthGeo, earthMat);
            earthGroup.add(earth);

            const cloudGeo = new THREE.SphereGeometry(6.05, segs, segs);
            const cloudMat = new THREE.MeshStandardMaterial({
                map: loadOptimizedTexture('https://unpkg.com/three-globe@2.45.6/example/img/earth-water.png'),
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending,
                side: THREE.DoubleSide
            });
            const clouds = new THREE.Mesh(cloudGeo, cloudMat);
            earthGroup.add(clouds);

            const moonGeo = new THREE.SphereGeometry(1.2, 20, 20);
            const moonMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.8 });
            const moon = new THREE.Mesh(moonGeo, moonMat);
            scene.add(moon);

            const starsGeo = new THREE.BufferGeometry();
            const starsCount = isMobile ? 1500 : 2200;
            const posArray = new Float32Array(starsCount * 3);
            const colorArray = new Float32Array(starsCount * 3);

            for (let i = 0; i < starsCount * 3; i += 3) {
                const r = 40 + Math.random() * 60;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                posArray[i] = r * Math.sin(phi) * Math.cos(theta);
                posArray[i + 1] = r * Math.sin(phi) * Math.sin(theta);
                posArray[i + 2] = r * Math.cos(phi);
                const rand = Math.random();
                let color = new THREE.Color(rand > 0.8 ? 0x5581ff : rand > 0.6 ? 0xff2a6d : rand > 0.4 ? 0x8a2be2 : 0xffffff);
                colorArray[i] = color.r;
                colorArray[i + 1] = color.g;
                colorArray[i + 2] = color.b;
            }
            starsGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            starsGeo.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));
            const starsMat = new THREE.PointsMaterial({ size: 0.1, vertexColors: true, transparent: true, opacity: 0.8 });
            const starMesh = new THREE.Points(starsGeo, starsMat);
            scene.add(starMesh);

            scene.add(new THREE.AmbientLight(0x111122, 0.5));
            const sunLight = new THREE.DirectionalLight(0xffffff, 2);
            sunLight.position.set(-15, 5, 5);
            scene.add(sunLight);
            const rimLight = new THREE.DirectionalLight(0x5581ff, 1);
            rimLight.position.set(10, -10, -10);
            scene.add(rimLight);

            let time = 0;
            let lastFrameTs = 0;
            const frameInterval = isMobile ? 33 : 16; // 30 FPS di Mobile untuk memangkas beban CPU

            function animate(now) {
                requestAnimationFrame(animate);
                if (document.hidden) return;
                if (now - lastFrameTs < frameInterval) return;
                lastFrameTs = now;

                earth.rotation.y += 0.0012;
                clouds.rotation.y += 0.0015;
                clouds.rotation.z += 0.0001;
                time += 0.0025;
                const moonOrbitRadius = 18;
                moon.position.x = earthGroup.position.x + Math.cos(time) * moonOrbitRadius;
                moon.position.z = earthGroup.position.z + Math.sin(time) * moonOrbitRadius;
                moon.position.y = earthGroup.position.y + Math.sin(time * 0.5) * 4;
                moon.rotation.y += 0.005;
                starMesh.rotation.y -= 0.0002;
                starMesh.rotation.x -= 0.0001;
                renderer.render(scene, camera);
            }
            requestAnimationFrame(animate);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                if (window.innerWidth < 768) earthGroup.position.set(0, -8, -10);
                else earthGroup.position.set(6, -4, -5);
            }, { passive: true });
        }

        // =========================================================

        let allApps = [];

        // TATADADA Universal State & Virtual Tracker Engine
        function syncAndTrack(actionName = null, pushHistory = false) {
            const params = new URLSearchParams();
            const titleParts = ['TATADADA PORTAL'];

            if (AppState.view !== 'home') { params.set('v', AppState.view); titleParts.push(AppState.view); }
            if (AppState.filter && AppState.filter !== 'ALL') { params.set('f', AppState.filter); titleParts.push(`Filter ${AppState.filter}`); }
            if (AppState.q) { params.set('q', AppState.q); titleParts.push(`"${AppState.q}"`); }
            if (AppState.modal) { params.set('m', AppState.modal); titleParts.push(`Modal ${AppState.modal}`); }
            if (actionName && actionName !== 'app_load') { params.set('action', actionName); }

            const newUrl = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
            const newTitle = titleParts.join(' • ');

            if (newUrl === lastTrackedUrl && !actionName) return;
            lastTrackedUrl = newUrl;

            document.title = newTitle;
            try {
                if (pushHistory) window.history.pushState({ ...AppState }, newTitle, newUrl);
                else if (window.location.search !== (params.toString() ? '?' + params.toString() : '')) {
                    window.history.replaceState({ ...AppState }, newTitle, newUrl);
                }
            } catch (e) {}

            if (typeof gtag === 'function') {
                gtag('event', 'page_view', { page_path: newUrl, page_title: newTitle });
                if (actionName) gtag('event', actionName, { ...AppState });
            }
            if (typeof _Hasync !== 'undefined') _Hasync.push(['Histats.track_hits', '']);
        }

        function hydrateStateFromURL() {
            const params = new URLSearchParams(window.location.search);
            AppState.view = params.get('v') || 'home';
            AppState.filter = (params.get('f') || 'ALL').toUpperCase();
            AppState.q = (params.get('q') || '').toLowerCase();
            AppState.modal = params.get('m') || '';

            const searchEl = document.getElementById('searchInput');
            if (searchEl) searchEl.value = AppState.q;

            updateFilterButtonsUI(AppState.filter);
            if (AppState.modal === 'terms') toggleModal(true, false);
            else toggleModal(false, false);

            if (allApps.length > 0) applyFilters();
            syncAndTrack('app_load', false);
        }

        // =========================================================
        // 3. UI BUILDER, CLOCK, THEME & RAF-BATCHED RENDERER
        // =========================================================
        function updateClock() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
            const dateStr = now.toLocaleDateString(currentLang === 'ID' ? 'id-ID' : 'en-US', { weekday: 'short', day: 'numeric', month: 'short' });
            const sysTime = document.getElementById('system-time');
            const sysDate = document.getElementById('system-date');
            if (sysTime) sysTime.textContent = timeStr;
            if (sysDate) sysDate.textContent = dateStr;
        }

        function toggleTheme() {
            const root = document.documentElement;
            const isDark = root.classList.toggle('dark');
            localStorage.setItem('tatadada_theme', isDark ? 'dark' : 'light');
            const btn = document.getElementById('theme-toggle');
            if (btn) {
                btn.innerHTML = `<i data-lucide="${isDark ? 'sun' : 'moon'}" class="w-3.5 h-3.5"></i>`;
                renderLucideIcons(btn);
            }
            syncAndTrack('theme_toggled', false);
        }

        function getHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash);
        }

        const premiumGradients = ['mesh-0', 'mesh-1', 'mesh-2', 'mesh-3', 'mesh-4', 'mesh-5', 'mesh-6', 'mesh-7'];
        const premiumIcons = [
            'rocket', 'zap', 'box', 'layout', 'palette', 'cpu', 'database',
            'globe', 'image', 'layers', 'package', 'settings', 'shield',
            'sparkles', 'tool', 'wrench', 'zap-off', 'album', 'briefcase', 'cloud'
        ];

        function getFancyIcon(name) {
            const hash = getHash(name.toLowerCase());
            return { grad: premiumGradients[hash % premiumGradients.length], icon: premiumIcons[hash % premiumIcons.length] };
        }

        function generateAlphabet() {
            const container = document.getElementById('alphabet-container');
            if (!container) return;
            const fragment = document.createDocumentFragment();
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(l => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.id = `btn-${l}`;
                btn.className = "alpha-btn";
                btn.textContent = l;
                btn.onclick = () => filterByLetter(l, true);
                fragment.appendChild(btn);
            });
            container.appendChild(fragment);
        }

        function updateFilterButtonsUI(letter) {
            document.querySelectorAll('.alpha-btn').forEach(b => b.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-${letter}`);

        function filterByLetter(letter, track = false) {
            AppState.filter = letter;
            updateFilterButtonsUI(letter);
            applyFilters();
            if (track) syncAndTrack('filter_changed', true);
        }

        function applyFilters() {
            const q = AppState.q;
            const letter = AppState.filter;
            const filtered = allApps.filter(app => {
                const matchesSearch = !q || app.name.toLowerCase().includes(q) || app.title.toLowerCase().includes(q);
                const firstChar = app.name.charAt(0).toUpperCase();
                let matchesLetter = true;
                if (letter === '#') matchesLetter = !/[A-Z]/.test(firstChar);
                else if (letter !== 'ALL') matchesLetter = firstChar === letter;
                return matchesSearch && matchesLetter;
            });
            renderApps(filtered);
        }

        function updateUIStrings() {
            const t = i18n[currentLang] || i18n['ID'];
            const elHelp = document.getElementById('help-text');
            const elLoading = document.getElementById('loading-text');

            const elLang = document.getElementById('lang-toggle');
            const elStatus = document.getElementById('system-status');

            const elTerms = document.getElementById('terms-content');
            const elAppCount = document.getElementById('app-count');

            if (elHelp) elHelp.textContent = t.help;
            if (elLoading) elLoading.textContent = t.loading;
            if (elSearch) elSearch.placeholder = t.search;
            if (elError) elError.textContent = t.error;

            if (elAppCount && allApps.length > 0) elAppCount.textContent = `${allApps.length} ${t.apps}`;

        }

        function toggleLanguage() {
            currentLang = currentLang === 'ID' ? 'EN' : 'ID';
            localStorage.setItem('tatadada_lang', currentLang);
            updateUIStrings();
            fetchRepoInfo();
            syncAndTrack('lang_changed', false);
        }

        function toggleModal(show, track = false) {
            const modal = document.getElementById('termsModal');
            const container = document.getElementById('modalContainer');
            if (!modal || !container) return;
            AppState.modal = show ? 'terms' : '';
            if (show) {
                modal.classList.remove('hidden');
                requestAnimationFrame(() => container.classList.remove('scale-95', 'opacity-0'));
            } else {
                container.classList.add('scale-95', 'opacity-0');
                setTimeout(() => modal.classList.add('hidden'), 220);
            }
            if (track) syncAndTrack(null, true);
        }

        let cachedRepoDate = null;
        async function fetchRepoInfo() {
            try {
                if (!cachedRepoDate) {
                    const response = await fetch(REPO_INFO_URL);
                    if (response.ok) {
                        const data = await response.json();
                        cachedRepoDate = data.pushed_at;
                    }
                }
                if (cachedRepoDate) {
                    const date = new Date(cachedRepoDate);
                    const formatted = date.toLocaleDateString(currentLang === 'ID' ? 'id-ID' : 'en-US', { day: 'numeric', month: 'short' });
                    const buildEl = document.getElementById('build-time');
                    if (buildEl) buildEl.textContent = formatted;
                }
            } catch (e) {}
        }

        function applyCustomXmlToContainer(iconContainer, data) {
            iconContainer.className = 'icon-container icon-squircle';
            iconContainer.style.setProperty('--bg-start', data.colorStart);
            iconContainer.style.setProperty('--bg-end', data.colorEnd);
            iconContainer.style.background = `linear-gradient(135deg, ${data.colorStart} 0%, ${data.colorEnd} 100%)`;
            iconContainer.style.setProperty('--glow', data.colorStart + '99');
            const waveHtml = data.ornament && data.ornament.includes('wave')
                ? `<div class="bg-wave-ornament" style="background: linear-gradient(180deg, #C13584 0%, ${data.colorStart} 100%);"></div>`
                : '';
            const pct = parseFloat(data.scaleStr || '0.75') * 100;
            iconContainer.innerHTML = `${waveHtml}<svg class="icon-svg" viewBox="0 0 100 100" fill="none" style="width:${pct}%;height:${pct}%;position:relative;z-index:10;" aria-hidden="true">${data.innerSvg}</svg>`;
        }

        // Antrean Fetch Terbatas + RAF DOM Batching (Mencegah Long Tasks >50ms saat parsing 84 XML)
        let fetchQueue = [];
        let activeFetches = 0;
        const MAX_CONCURRENT_FETCHES = 6;
        let cacheDirty = false;
        let pendingDomUpdates = [];
        let rafUpdateScheduled = false;

        function flushPendingDomUpdates() {
            rafUpdateScheduled = false;
            const batch = pendingDomUpdates.splice(0, 12);
            for (let i = 0; i < batch.length; i++) {
                const item = batch[i];
                if (item.iconContainer.isConnected) {
                    applyCustomXmlToContainer(item.iconContainer, item.parsed);
                }
            }
            if (pendingDomUpdates.length > 0) {
                rafUpdateScheduled = true;
                requestAnimationFrame(flushPendingDomUpdates);
            }
        }

        function enqueueIconFetch(appName, iconContainer) {
            fetchQueue.push({ appName, iconContainer });
            processFetchQueue();
        }

        function processFetchQueue() {
            while (activeFetches < MAX_CONCURRENT_FETCHES && fetchQueue.length > 0) {
                const { appName, iconContainer } = fetchQueue.shift();
                activeFetches++;
                fetch(`${BASE_PAGES_URL}${appName}/icon.xml`)
                    .then(res => res.ok ? res.text() : Promise.reject())
                    .then(xmlStr => {
                        const xmlDoc = new DOMParser().parseFromString(xmlStr, "text/xml");
                        if (xmlDoc.getElementsByTagName("parsererror").length > 0) return;

                        const colorStart = xmlDoc.querySelector('color_start')?.textContent || '#007AFF';
                        const colorEnd = xmlDoc.querySelector('color_end')?.textContent || '#5856D6';
                        const scaleStr = xmlDoc.querySelector('icon_scale')?.textContent || '0.75';
                        const ornament = xmlDoc.querySelector('ornament')?.textContent || 'none';
                        const svgElementsNode = xmlDoc.querySelector('svg_elements');

                        let innerSvg = '';
                        if (svgElementsNode) {
                            const serializer = new XMLSerializer();
                            Array.from(svgElementsNode.childNodes).forEach(node => {
                                if (node.nodeType === 1) innerSvg += serializer.serializeToString(node);
                            });
                        }

                        const parsed = { colorStart, colorEnd, scaleStr, ornament, innerSvg };
                        iconCache[appName] = parsed;
                        cacheDirty = true;
                        pendingDomUpdates.push({ iconContainer, parsed });
                        if (!rafUpdateScheduled) {
                            rafUpdateScheduled = true;
                            requestAnimationFrame(flushPendingDomUpdates);
                        }
                    })
                    .catch(() => {
                        iconCache[appName] = { missing: true };
                        cacheDirty = true;
                    })
                    .finally(() => {
                        activeFetches--;
                        if (fetchQueue.length > 0) {
                            processFetchQueue();
                        } else if (activeFetches === 0) {
                            if (cacheDirty) {
                                cacheDirty = false;
                                saveIconCache();
                            }
                            scheduleSpace3D();
                        }
                    });
            }
        }

        function renderApps(apps) {
            const appGrid = document.getElementById('appGrid');
            const emptyState = document.getElementById('emptyState');
            if (!appGrid || !emptyState) return;

            fetchQueue = [];
            pendingDomUpdates = [];
            appGrid.innerHTML = '';

            if (apps.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            const fragment = document.createDocumentFragment();

            apps.forEach(app => {
                const config = getFancyIcon(app.name);
                const card = document.createElement('a');
                card.href = app.url;
                card.target = "_blank";
                card.rel = "noopener";
                card.className = 'ios-card group';
                card.onclick = () => syncAndTrack(`launch_${app.name}`, false);

                const iconContainer = document.createElement('div');
                const cachedData = iconCache[app.name];

                if (cachedData && !cachedData.missing) {
                    applyCustomXmlToContainer(iconContainer, cachedData);
                } else {
                    iconContainer.className = `icon-container icon-squircle ${config.grad}`;
                    iconContainer.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:45%;height:45%;">${LUCIDE_SVGS[config.icon] || LUCIDE_SVGS['box']}</svg>`;
                    if (!cachedData && !KNOWN_NO_ICON_XML.has(app.name)) {
                        enqueueIconFetch(app.name, iconContainer);
                    }
                }

                const titleEl = document.createElement('h3');
                titleEl.className = 'app-title';
                titleEl.textContent = app.title;

                card.appendChild(iconContainer);
                card.appendChild(titleEl);
                fragment.appendChild(card);
            });

            appGrid.appendChild(fragment);

            if (fetchQueue.length === 0 && activeFetches === 0) {
                scheduleSpace3D();
            }
        }

        async function fetchApps() {
            const statusMessage = document.getElementById('statusMessage');
            const errorMessage = document.getElementById('errorMessage');
            const errorDetail = document.getElementById('errorDetail');

            try {
                const cachedList = sessionStorage.getItem(APPS_CACHE_KEY);
                if (cachedList) {
                    allApps = JSON.parse(cachedList);
                    const appCountEl = document.getElementById('app-count');
                    if (appCountEl) appCountEl.textContent = `${allApps.length} ${i18n[currentLang]?.apps || 'APPS'}`;
                    applyFilters();
                    return;
                }
            } catch (e) {}

            if (statusMessage) statusMessage.classList.remove('hidden');

            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Mencapai Limit API GitHub');
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error(data.message || 'Data tidak valid');

                allApps = data
                    .filter(item => item.type === 'dir' && !item.name.startsWith('.'))
                    .map(folder => ({
                        name: folder.name,
                        url: `${BASE_PAGES_URL}${folder.name}/`,
                        githubUrl: folder.html_url,
                        title: folder.name.replace(/[-_]/g, ' ').replace(/\b\w/g, l => l.toUpperCase())
                    }))
                    .sort((a, b) => a.name.localeCompare(b.name));

                try { sessionStorage.setItem(APPS_CACHE_KEY, JSON.stringify(allApps)); } catch (e) {}

                const appCountEl = document.getElementById('app-count');
                if (appCountEl) appCountEl.textContent = `${allApps.length} ${i18n[currentLang]?.apps || 'APPS'}`;

                applyFilters();
            } catch (error) {
                if (errorMessage) errorMessage.classList.remove('hidden');
                if (errorDetail) errorDetail.textContent = error.message;
                scheduleSpace3D();
            } finally {
                if (statusMessage) statusMessage.classList.add('hidden');
            }
        }

        // =========================================================
        // 4. BOOTSTRAP
        // =========================================================
        window.addEventListener('popstate', hydrateStateFromURL);

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('tatadada_theme');
            if (savedTheme === 'light') document.documentElement.classList.remove('dark');

            generateAlphabet();
            updateUIStrings();
            renderLucideIcons();
            hydrateStateFromURL();

            setInterval(updateClock, 1000);

            const searchEl = document.getElementById('searchInput');
            let searchDebounce;
            if (searchEl) {
                searchEl.addEventListener('input', (e) => {
                    AppState.q = e.target.value.toLowerCase().trim();
                    applyFilters();
                    clearTimeout(searchDebounce);
                    searchDebounce = setTimeout(() => syncAndTrack('search_query', false), 400);
                });
            }

            fetchRepoInfo();
            fetchApps();
        });
    </script>

    <!-- UX Protection Anti-Select/Right-Click -->
    <script>
    document.addEventListener('contextmenu', e => {
        if (!e.target.closest('input, textarea, [contenteditable="true"], .allow-context, .selectable')) e.preventDefault();
    });
    </script>
</body>
</html>
