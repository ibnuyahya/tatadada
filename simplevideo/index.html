<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Video Processor</title>
    <!-- Memuat FFmpeg secara fisik di head agar terpeta dengan benar oleh Webpack -->
    <script src="./lib/ffmpeg.js"></script>
    <style>
        /* Desain Variabel Warna Premium */
        :root {
            --bg-slate-900: #0f172a;
            --bg-slate-800: #1e293b;
            --bg-slate-950: #020617;
            --border-slate-700: #334155;
            --text-slate-100: #f1f5f9;
            --text-slate-300: #cbd5e1;
            --text-slate-400: #94a3b8;
            --text-slate-500: #64748b;
            --blue-400: #60a5fa;
            --indigo-400: #818cf8;
            --indigo-500: #6366f1;
            --indigo-600: #4f46e5;
            --emerald-400: #34d399;
            --emerald-500: #10b981;
            --emerald-600: #059669;
            --amber-400: #fbbf24;
            --red-400: #f87171;
        }

        body {
            background-color: var(--bg-slate-900);
            color: var(--text-slate-100);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            margin: 0;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--bg-slate-800);
            border: 1px solid var(--border-slate-700);
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 1.5rem;
            width: 100%;
            max-width: 42rem;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, var(--blue-400), var(--indigo-400));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            user-select: none;
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            border-width: 1px;
            border-style: solid;
        }

        .badge-connecting {
            background-color: rgba(251, 191, 36, 0.1);
            color: var(--amber-400);
            border-color: rgba(251, 191, 36, 0.2);
        }

        .badge-ready {
            background-color: rgba(52, 211, 153, 0.1);
            color: var(--emerald-400);
            border-color: rgba(52, 211, 153, 0.2);
        }

        .badge-failed {
            background-color: rgba(248, 113, 113, 0.1);
            color: var(--red-400);
            border-color: rgba(248, 113, 113, 0.2);
        }
    </style>
    <style>
        .uploader-zone {
            border: 2px dashed var(--border-slate-700);
            border-radius: 0.75rem;
            padding: 1.5rem;
            text-align: center;
            position: relative;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .uploader-zone:hover {
            border-color: var(--blue-400);
            background-color: rgba(96, 165, 250, 0.02);
        }

        .uploader-input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .uploader-icon {
            margin: 0 auto 0.5rem auto;
            height: 3rem;
            width: 3rem;
            color: var(--text-slate-400);
        }

        .uploader-text {
            font-size: 0.875rem;
            color: var(--text-slate-300);
        }

        .uploader-highlight {
            font-weight: 600;
            color: var(--blue-400);
        }

        .uploader-subtext {
            font-size: 0.75rem;
            color: var(--text-slate-500);
            margin: 0.25rem 0 0 0;
        }

        .btn-process {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: not-allowed;
            background-color: var(--border-slate-700);
            color: var(--text-slate-400);
            transition: background-color 0.2s, box-shadow 0.2s;
            margin-top: 1rem;
        }

        .btn-process.active {
            background-color: var(--indigo-600);
            color: var(--text-slate-100);
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        }

        .btn-process.active:hover {
            background-color: var(--indigo-500);
        }

        .status-container {
            margin-top: 1rem;
        }

        .status-text {
            text-align: center;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-slate-400);
            padding: 0.25rem 0;
        }

        .progress-track {
            width: 100%;
            background-color: var(--border-slate-700);
            border-radius: 9999px;
            height: 0.625rem;
            overflow: hidden;
            display: none;
            margin-top: 0.5rem;
        }

        .progress-bar {
            background-color: var(--blue-400);
            height: 100%;
            width: 0%;
            transition: width 0.2s;
        }
    </style>
    <style>
        .output-container {
            display: none;
            margin-top: 1.5rem;
            background-color: var(--bg-slate-950);
            border: 1px solid var(--border-slate-700);
            border-radius: 0.75rem;
            padding: 1rem;
        }

        .output-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-slate-400);
            margin: 0 0 0.5rem 0;
        }

        video {
            width: 100%;
            border-radius: 0.5rem;
            background-color: #000;
            max-height: 300px;
        }

        .download-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.75rem;
        }

        .btn-download {
            padding: 0.5rem 1rem;
            background-color: var(--emerald-600);
            color: white;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 0.5rem;
            transition: background-color 0.2s;
        }

        .btn-download:hover {
            background-color: var(--emerald-500);
        }

        .terminal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .terminal-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-slate-400);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0;
        }

        .btn-clear {
            background: none;
            border: none;
            color: var(--text-slate-500);
            font-size: 0.625rem;
            cursor: pointer;
            padding: 0.25rem;
            transition: color 0.2s;
        }

        .btn-clear:hover {
            color: var(--text-slate-300);
        }

        .terminal-log {
            height: 12rem;
            background-color: var(--bg-slate-950);
            padding: 0.75rem;
            border-radius: 0.75rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            color: var(--emerald-400);
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: pre-wrap;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Video Processor</h1>
            <span id="lib-status-badge" class="badge badge-connecting">
                Menghubungkan...
            </span>
        </div>

        <div class="space-y-4">
            <!-- Area Input Berkas -->
            <div class="uploader-zone">
                <input type="file" id="uploader" accept="video/*" class="uploader-input">
                <div>
                    <svg class="uploader-icon" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                        <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <div class="uploader-text">
                        <span id="file-name-label" class="uploader-highlight">Pilih file video</span> atau seret ke sini
                    </div>
                    <p class="uploader-subtext">MP4, WebM, MKV, AVI, dll.</p>
                </div>
            </div>

            <!-- Tombol Konversi -->
            <button id="btnProcess" disabled class="btn-process">
                Mulai Konversi ke MP4
            </button>

            <!-- Indikator Status & Progress Bar -->
            <div class="status-container">
                <div id="status" class="status-text">Menghubungkan ke library...</div>
                <div id="progress-container" class="progress-track">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>

            <!-- Hasil Pemrosesan Video -->
            <div id="output-container" class="output-container">
                <h3 class="output-title">Hasil Pemrosesan:</h3>
                <video id="output-video" controls></video>
                <div class="download-wrapper">
                    <a id="btnDownload" class="btn-download" download="processed_video.mp4">
                        Download Video
                    </a>
                </div>
            </div>

            <!-- Log Terminal Real-time -->
            <div>
                <div class="terminal-header">
                    <h3 class="terminal-title">FFmpeg Terminal Logs</h3>
                    <button id="btnClearLogs" class="btn-clear">Bersihkan</button>
                </div>
                <div id="ffmpeg-logs" class="terminal-log"></div>
            </div>
        </div>
    </div>

    <script>
        let ffmpeg = null;
        let isCoreLoaded = false;
        const libBasePath = './lib'; // Path dasar tempat ffmpeg.js berada

        const statusLabel = document.getElementById('status');
        const libBadge = document.getElementById('lib-status-badge');
        const btnProcess = document.getElementById('btnProcess');
        const uploader = document.getElementById('uploader');
        const fileNameLabel = document.getElementById('file-name-label');
        const logContainer = document.getElementById('ffmpeg-logs');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');

        // Fungsi mencatat log ke terminal virtual di halaman
        function appendLog(message) {
            logContainer.textContent += message + '\n';
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // Fungsi pembantu untuk fetch file secara manual ke bentuk Uint8Array
        async function customFetchFile(file) {
            if (typeof file === 'string') {
                const response = await fetch(file);
                return new Uint8Array(await response.arrayBuffer());
            }
            if (file instanceof File || file instanceof Blob) {
                return new Uint8Array(await file.arrayBuffer());
            }
            return file;
        }

        // Inisialisasi utama FFmpegWASM v0.12
        function initFFmpeg() {
            appendLog('Memulai pemeriksaan library FFmpeg...');
            appendLog(`[Status Global] window.FFmpegWASM: ${typeof window.FFmpegWASM}`);
            appendLog(`[Status Isolasi] window.crossOriginIsolated: ${window.crossOriginIsolated}`);

            // Cek pre-flight isolasi browser untuk SharedArrayBuffer
            if (!window.crossOriginIsolated) {
                appendLog('[⚠️ Peringatan] window.crossOriginIsolated bernilai false. SharedArrayBuffer tidak tersedia.');
                libBadge.className = "badge badge-failed";
                libBadge.innerText = "Terblokir";
                statusLabel.innerText = "SharedArrayBuffer diblokir. Harap periksa konfigurasi header server Anda.";
                return;
            } else {
                appendLog('✅ Keamanan browser terverifikasi aman (SharedArrayBuffer diizinkan)!');
            }

            const lib = window.FFmpegWASM;

            if (lib && lib.FFmpeg) {
                try {
                    ffmpeg = new lib.FFmpeg();

                    // Daftarkan listener log real-time
                    ffmpeg.on('log', ({ message }) => {
                        appendLog(`[FFmpeg] ${message}`);
                    });

                    // Daftarkan listener progress bar
                    ffmpeg.on('progress', ({ progress }) => {
                        const percent = Math.round(progress * 100);
                        statusLabel.innerText = `Memproses video: ${percent}% selesai...`;
                        progressBar.style.width = `${percent}%`;
                    });

                    libBadge.className = "badge badge-ready";
                    libBadge.innerText = "Siap (v0.12)";
                    statusLabel.innerText = "Silakan pilih video untuk memulai.";
                    appendLog('🎉 [Sistem] FFmpegWASM v0.12 berhasil diaktifkan dengan jalur aman!');
                } catch (err) {
                    libBadge.className = "badge badge-failed";
                    libBadge.innerText = "Gagal";
                    statusLabel.innerText = "Gagal membuat instance FFmpeg.";
                    appendLog('❌ [Error] ' + err.message);
                }
            } else {
                libBadge.className = "badge badge-failed";
                libBadge.innerText = "Gagal";
                statusLabel.innerText = "Gagal mendeteksi objek FFmpegWASM. Periksa berkas ./lib/ffmpeg.js.";
                appendLog('❌ Error: Objek window.FFmpegWASM.FFmpeg tidak ditemukan.');
            }
        }

        // Jalankan saat seluruh aset halaman selesai dimuat
        window.addEventListener('load', initFFmpeg);

        // Event listener saat berkas dipilih
        uploader.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileNameLabel.innerText = file.name;
                btnProcess.disabled = false;
                btnProcess.className = "btn-process active";
                statusLabel.innerText = `File "${file.name}" siap diproses.`;
                progressContainer.style.display = 'none';
                progressBar.style.width = '0%';
            }
        });

        document.getElementById('btnClearLogs').addEventListener('click', () => {
            logContainer.textContent = '';
        });

        // Handler Konversi Video
        btnProcess.addEventListener('click', async () => {
            const file = uploader.files[0];
            if (!file || !ffmpeg) return;

            btnProcess.disabled = true;
            btnProcess.className = "btn-process";
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';

            try {
                if (!isCoreLoaded) {
                    statusLabel.innerText = 'Memuat core WASM...';
                    appendLog('[Sistem] Mengunduh core & WASM dari direktori lokal...');
                    
                    const lib = window.FFmpegWASM;
                    const { toBlobURL } = lib || {};
                    let loadConfig = {};
                    
                    if (toBlobURL) {
                        try {
                            appendLog('[Sistem] Mencoba memetakan core & WASM menggunakan toBlobURL...');
                            loadConfig = {
                                coreURL: await toBlobURL(`${libBasePath}/ffmpeg-core.js`, 'text/javascript'),
                                wasmURL: await toBlobURL(`${libBasePath}/ffmpeg-core.wasm`, 'application/wasm')
                            };
                        } catch (blobErr) {
                            appendLog(`[⚠️ Peringatan] Gagal membuat Blob URL: ${blobErr.message}. Menggunakan pemuatan jalur langsung.`);
                            loadConfig = {
                                coreURL: `${libBasePath}/ffmpeg-core.js`,
                                wasmURL: `${libBasePath}/ffmpeg-core.wasm`
                            };
                        }
                    } else {
                        loadConfig = {
                            coreURL: `${libBasePath}/ffmpeg-core.js`,
                            wasmURL: `${libBasePath}/ffmpeg-core.wasm`
                        };
                    }
                    
                    appendLog('[Sistem] Mengeksekusi ffmpeg.load()...');
                    await ffmpeg.load(loadConfig);
                    isCoreLoaded = true;
                    appendLog('✅ [Sistem] Core WASM berhasil diinisialisasi!');
                }

                const inputName = file.name;
                const outputName = 'converted_' + Date.now() + '.mp4';
                
                statusLabel.innerText = 'Menulis video ke disk virtual...';
                const fileData = await customFetchFile(file);

                await ffmpeg.writeFile(inputName, fileData);

                statusLabel.innerText = 'Memulai proses konversi ke MP4...';
                appendLog(`[Sistem] Menjalankan perintah: ffmpeg -i ${inputName} -c:v libx264 -preset ultrafast -crf 28 ${outputName}`);
                
                await ffmpeg.exec(['-i', inputName, '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '28', outputName]);

                statusLabel.innerText = 'Membaca file hasil konversi...';
                const data = await ffmpeg.readFile(outputName);

                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(blob);

                const outputVideo = document.getElementById('output-video');
                const outputContainer = document.getElementById('output-container');
                const btnDownload = document.getElementById('btnDownload');

                outputVideo.src = videoUrl;
                btnDownload.href = videoUrl;
                btnDownload.download = 'converted_' + inputName.substring(0, inputName.lastIndexOf('.')) + '.mp4';
                
                outputContainer.style.display = 'block';
                statusLabel.innerText = 'Konversi Berhasil!';
                progressBar.style.width = '100%';
                appendLog('🎉 [Sistem] Proses konversi selesai dengan sukses!');

                await ffmpeg.deleteFile(inputName);
                await ffmpeg.deleteFile(outputName);

            } catch (error) {
                statusLabel.innerText = 'Gagal memproses video!';
                let detailedMessage = error && error.message ? error.message : JSON.stringify(error);
                if (detailedMessage === '{}' || !detailedMessage) {
                    detailedMessage = 'Gagal memuat core WASM. Hal ini dikonfirmasi karena browser memblokir SharedArrayBuffer.';
                }
                appendLog(`❌ [Error] ${detailedMessage}`);
                console.error("FFmpeg Core Load Error: ", error);
            } finally {
                btnProcess.disabled = false;
                btnProcess.className = "btn-process active";
            }
        });
    </script>
</body>
</html>
