<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Video Processor - Diagnostik</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center py-10">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-lg">
        <h1 class="text-2xl font-bold mb-4 text-gray-800">Cek Diagnostik Library</h1>
        <p class="text-gray-600 mb-6">Sistem sedang mencoba memuat semua file di direktori /lib/.</p>
        
        <div id="check-list" class="space-y-2 text-sm">
            <!-- Status file akan muncul di sini -->
        </div>

        <div id="status" class="mt-6 p-4 bg-gray-50 rounded border text-sm font-mono text-gray-700"></div>
    </div>

    <script>
        const libFiles = [
            './lib/ffmpeg.js',
            './lib/ffmpeg-core.js',
            './lib/ffmpeg-core.wasm'
        ];

        async function checkFiles() {
            const listContainer = document.getElementById('check-list');
            const statusBox = document.getElementById('status');
            
            for (const file of libFiles) {
                const div = document.createElement('div');
                div.innerHTML = `Memeriksa: <b>${file}</b> ...`;
                listContainer.appendChild(div);

                try {
                    const response = await fetch(file, { method: 'HEAD' });
                    if (response.ok) {
                        div.innerHTML = `✅ <b>${file}</b>: Berhasil dimuat (${response.status})`;
                    } else {
                        div.innerHTML = `❌ <b>${file}</b>: Gagal (Status: ${response.status})`;
                    }
                } catch (e) {
                    div.innerHTML = `❌ <b>${file}</b>: Network Error / Gagal`;
                }
            }
            statusBox.innerText = "Diagnostik selesai. Silakan cek tab 'Network' di Developer Tools (F12) untuk detail lebih lanjut.";
        }

        window.onload = checkFiles;
    </script>
</body>
</html>
