<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure SIMD Engine + Preview</title>
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; margin: 0; }
        .container { background-color: #1e293b; border: 1px solid #334155; border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); width: 100%; max-width: 42rem; padding: 1.5rem; box-sizing: border-box; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
        .title { font-size: 1.5rem; font-weight: 800; margin: 0; background: linear-gradient(to right, #34d399, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .badge { font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.75rem; border-radius: 9999px; background-color: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
        .dropzone { border: 2px dashed #475569; border-radius: 0.75rem; padding: 1.5rem; text-align: center; position: relative; cursor: pointer; transition: border-color 0.2s; margin-bottom: 1rem; }
        .dropzone:hover { border-color: #3b82f6; }
        .dropzone input[type="file"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        /* GAYA UNTUK RENDER MONITOR */
        .render-monitor { position: relative; width: 100%; aspect-ratio: 16/9; background-color: #000; border-radius: 0.75rem; overflow: hidden; display: none; margin-bottom: 1rem; border: 1px solid #334155; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
        .render-monitor canvas { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; filter: contrast(1.1); }
        .monitor-overlay { position: absolute; top: 10px; right: 10px; background-color: rgba(225, 29, 72, 0.9); color: white; font-size: 0.7rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; animation: blink 1s infinite; font-family: monospace; letter-spacing: 1px;}
        .monitor-time { position: absolute; bottom: 10px; left: 10px; background-color: rgba(0, 0, 0, 0.7); color: #34d399; font-size: 0.8rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; font-family: monospace; }
        @keyframes blink { 50% { opacity: 0; } }

        .btn { width: 100%; padding: 0.75rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 600; border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-top: 0.5rem; }
        .btn:disabled { background-color: #334155; color: #64748b; cursor: not-allowed; }
        .btn-primary { background-color: #059669; color: #ffffff; }
        .btn-primary:hover:not(:disabled) { background-color: #047857; }
        .status-text { text-align: center; font-size: 0.875rem; color: #94a3b8; margin: 1rem 0; font-weight: bold; }
        .progress-container { width: 100%; background-color: #334155; border-radius: 9999px; height: 0.625rem; overflow: hidden; display: none; margin-bottom: 1rem; }
        .progress-bar { background-color: #34d399; height: 100%; width: 0%; transition: width 0.1s linear; }
        .terminal { height: 12rem; background-color: #020617; border: 1px solid #1e293b; border-radius: 0.75rem; padding: 0.75rem; font-family: monospace; font-size: 0.75rem; color: #34d399; overflow-y: auto; white-space: pre-wrap; }
        .output-box { display: none; margin-top: 1rem; }
        .output-box video { width: 100%; border-radius: 0.75rem; border: 1px solid #334155; }
    </style>

    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Turbo SIMD + Preview</h1>
            <span id="badge" class="badge">Checking...</span>
        </div>

        <div class="dropzone">
            <div class="text-main"><span id="file-name-label" style="font-weight: 600; color: #34d399;">Pilih file video</span> atau seret ke sini</div>
            <p class="text-sub" style="font-size: 0.75rem; color: #64748b;">Mendukung H.264, WebM, MKV</p>
            <input type="file" id="uploader" accept="video/*">
        </div>

        <div id="render-monitor" class="render-monitor">
            <canvas id="preview-canvas"></canvas>
            <div class="monitor-overlay">🔴 RENDERING</div>
            <div id="monitor-time" class="monitor-time">00:00:00.000</div>
        </div>

        <button id="btnProcess" disabled class="btn btn-primary">Render 1080p 60FPS (SIMD)</button>

        <div id="status" class="status-text">Siap untuk memproses.</div>
        <div id="progress-container" class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div id="output-container" class="output-box">
            <video id="output-video" controls></video>
        </div>

        <h3 style="font-size: 0.75rem; color: #94a3b8; text-transform: uppercase;">Log Mesin</h3>
        <div id="ffmpeg-logs" class="terminal">Menunggu instruksi...</div>
    </div>

    <script>
        const { FFmpeg } = window.FFmpegWASM;
        const { fetchFile, toBlobURL } = window.FFmpegUtil;

        const logContainer = document.getElementById('ffmpeg-logs');
        const badge = document.getElementById('badge');
        
        // Komponen Monitor Preview
        const renderMonitor = document.getElementById('render-monitor');
        const previewCanvas = document.getElementById('preview-canvas');
        const monitorTime = document.getElementById('monitor-time');
        const ctx = previewCanvas.getContext('2d', { alpha: false }); // alpha false untuk efisiensi CPU
        const shadowVideo = document.createElement('video');
        let totalDuration = 0;
        
        function appendLog(message) {
            logContainer.textContent += `\n${message}`;
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        let ffmpeg = null;
        let isEngineLoaded = false;

        if (!window.crossOriginIsolated) {
            badge.style.color = '#ef4444';
            badge.innerText = 'Tidak Aman';
        } else {
            badge.innerText = 'Keamanan SIMD Lolos';
        }

        document.getElementById('uploader').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('file-name-label').innerText = file.name;
                document.getElementById('btnProcess').disabled = false;
                
                // Siapkan Shadow Video untuk Preview
                shadowVideo.src = URL.createObjectURL(file);
                shadowVideo.onloadedmetadata = () => {
                    totalDuration = shadowVideo.duration;
                    previewCanvas.width = shadowVideo.videoWidth;
                    previewCanvas.height = shadowVideo.videoHeight;
                    // Gambar frame pertama
                    shadowVideo.currentTime = 0;
                };
            }
        });

        // Event listener saat Shadow Video selesai melompat ke detik tertentu
        shadowVideo.addEventListener('seeked', () => {
            // Lukis video ke dalam kanvas monitor
            ctx.drawImage(shadowVideo, 0, 0, previewCanvas.width, previewCanvas.height);
        });

        document.getElementById('btnProcess').addEventListener('click', async () => {
            const file = document.getElementById('uploader').files[0];
            if (!file) return;

            document.getElementById('btnProcess').disabled = true;
            document.getElementById('progress-container').style.display = 'block';
            document.getElementById('progress-bar').style.width = '0%';
            
            // Tampilkan Monitor Render
            renderMonitor.style.display = 'block';

            try {
                if (!ffmpeg) {
                    ffmpeg = new FFmpeg();
                    ffmpeg.on('log', ({ message }) => appendLog(`[FFmpeg] ${message}`));
                    
                    // SINKRONISASI PROGRESS FFmpeg DENGAN KANVAS
                    ffmpeg.on('progress', ({ progress, time }) => {
                        const percent = Math.max(0, Math.min(100, Math.round(progress * 100)));
                        document.getElementById('status').innerText = `Upscaling & Rendering: ${percent}% selesai...`;
                        document.getElementById('progress-bar').style.width = `${percent}%`;
                        
                        // Perbarui waktu di monitor
                        if (time) {
                            const secs = (time / 1000000).toFixed(3);
                            monitorTime.innerText = `Posisi: ${secs}s`;
                        }

                        // Lompatkan Shadow Video ke persentase progress yang sesuai
                        if (totalDuration > 0) {
                            const targetTime = progress * totalDuration;
                            // Batasi pembaruan agar tidak membanjiri antrean DOM
                            if (Math.abs(shadowVideo.currentTime - targetTime) > 0.1) {
                                shadowVideo.currentTime = targetTime;
                            }
                        }
                    });
                }

                if (!isEngineLoaded) {
                    document.getElementById('status').innerText = 'Menyalakan Mesin...';
                    const localBaseURL = 'https://danial.my.id/simplevideo/lib/simd';
                    const classWorkerURL = await toBlobURL('https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js', 'text/javascript');

                    await ffmpeg.load({
                        coreURL: `${localBaseURL}/ffmpeg-core.js`,
                        wasmURL: `${localBaseURL}/ffmpeg-core.wasm`,
                        workerURL: `${localBaseURL}/ffmpeg-core.worker.js`,
                        classWorkerURL: classWorkerURL
                    });
                    
                    isEngineLoaded = true;
                }

                const inputName = file.name;
                const outputName = 'output_turbo.mp4';
                
                document.getElementById('status').innerText = 'Memuat video ke memori...';
                await ffmpeg.writeFile(inputName, await fetchFile(file));

                document.getElementById('status').innerText = 'Memulai proses konversi...';
                
                const startTime = performance.now();

                // PERINTAH DENGAN PAKSAAN UPSCALE LANCZOS 1080p & UPFRAME 60FPS
                await ffmpeg.exec([
                    '-i', inputName, 
                    '-vf', 'scale=1920:1080:flags=lanczos,framerate=fps=60', 
                    '-c:v', 'libx264', 
                    '-preset', 'ultrafast', 
                    '-crf', '28', 
                    '-threads', '0', 
                    outputName
                ]);

                const endTime = performance.now();
                appendLog(`\n🎉 Selesai! Eksekusi Turbo sukses dalam ${((endTime - startTime) / 1000).toFixed(2)} detik!`);

                document.getElementById('status').innerText = 'Menyelesaikan file...';
                const data = await ffmpeg.readFile(outputName);

                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(blob);

                document.getElementById('output-video').src = videoUrl;
                document.getElementById('output-container').style.display = 'block';
                
                document.getElementById('status').innerText = 'Render Selesai Sempurna!';
                document.getElementById('progress-bar').style.width = '100%';
                
                // Matikan Monitor Render
                renderMonitor.style.display = 'none';

            } catch (error) {
                document.getElementById('status').innerText = 'Gagal memproses video!';
                appendLog(`❌ [Error Fatal] ${error.message}`);
                console.error(error);
            } finally {
                document.getElementById('btnProcess').disabled = false;
            }
        });
    </script>
</body>
</html>
