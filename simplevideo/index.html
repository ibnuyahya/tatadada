<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Video Processor</title>
    <script data-cfasync="false" src="./lib/ffmpeg.js"></script>
    
    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 42rem;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }
        .title {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(to right, #60a5fa, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            background-color: rgba(245, 158, 11, 0.1);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
        .badge.ready {
            background-color: rgba(16, 185, 129, 0.1);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .badge.failed {
            background-color: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        .dropzone {
            border: 2px dashed #475569;
            border-radius: 0.75rem;
            padding: 1.5rem;
            text-align: center;
            position: relative;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .dropzone:hover {
            border-color: #3b82f6;
        }
        .dropzone input[type="file"] {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        .dropzone svg {
            height: 3rem;
            width: 3rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
        }
        .dropzone .text-main {
            font-size: 0.875rem;
            color: #cbd5e1;
            margin-bottom: 0.25rem;
        }
        .dropzone .text-sub {
            font-size: 0.75rem;
            color: #64748b;
            margin: 0;
        }
        .btn {
            width: 100%;
            padding: 0.75rem;
            border-radius: 0.75rem;
            font-size: 0.875rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-sizing: border-box;
            margin-top: 1rem;
        }
        .btn:disabled {
            background-color: #334155;
            color: #64748b;
            cursor: not-allowed;
        }
        .btn-primary {
            background-color: #4f46e5;
            color: #ffffff;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #4338ca;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }
        .status-text {
            text-align: center;
            font-size: 0.875rem;
            color: #94a3b8;
            margin: 1rem 0;
        }
        .progress-container {
            width: 100%;
            background-color: #334155;
            border-radius: 9999px;
            height: 0.625rem;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            background-color: #3b82f6;
            height: 100%;
            width: 0%;
            transition: width 0.2s;
        }
        .output-box {
            display: none;
            margin-top: 1rem;
        }
        .output-box h3 {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-top: 0;
            margin-bottom: 0.5rem;
        }
        .output-box video {
            width: 100%;
            border-radius: 0.75rem;
            border: 1px solid #334155;
            background-color: #000000;
            max-height: 300px;
        }
        .download-wrapper {
            display: flex;
            justify-content: flex-end;
            margin-top: 0.5rem;
        }
        .btn-download {
            background-color: #059669;
            color: #ffffff;
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 0.5rem;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .btn-download:hover {
            background-color: #047857;
        }
        .terminal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .terminal-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .btn-clear {
            background: none;
            border: none;
            color: #64748b;
            font-size: 0.625rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        .btn-clear:hover {
            color: #cbd5e1;
        }
        .terminal {
            height: 12rem;
            background-color: #020617;
            border: 1px solid #1e293b;
            border-radius: 0.75rem;
            padding: 0.75rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.75rem;
            color: #34d399;
            overflow-y: auto;
            white-space: pre-wrap;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Video Processor</h1>
            <span id="lib-status-badge" class="badge">Menghubungkan...</span>
        </div>

        <div>
            <!-- Area Input Berkas -->
            <div class="dropzone">
                <svg fill="none" stroke="currentColor" viewBox="0 0 48 48">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <div class="text-main">
                    <span id="file-name-label" style="font-weight: 600; color: #60a5fa;">Pilih file video</span> atau seret ke sini
                </div>
                <p class="text-sub">MP4, WebM, MKV, AVI, dll.</p>
                <input type="file" id="uploader" accept="video/*">
            </div>

            <!-- Tombol Konversi -->
            <button id="btnProcess" disabled class="btn btn-primary">
                <span>Mulai Konversi ke MP4</span>
            </button>

            <!-- Indikator Status & Progress Bar -->
            <div>
                <div id="status" class="status-text">Menghubungkan ke library...</div>
                <div id="progress-container" class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
            </div>

            <!-- Hasil Pemrosesan Video -->
            <div id="output-container" class="output-box">
                <h3>Hasil Pemrosesan:</h3>
                <video id="output-video" controls></video>
                <div class="download-wrapper">
                    <a id="btnDownload" class="btn-download" download="processed_video.mp4">
                        Download Video
                    </a>
                </div>
            </div>

            <!-- Log Terminal Real-time -->
            <div>
                <div class="terminal-header">
                    <span class="terminal-title">FFmpeg Terminal Logs</span>
                    <button id="btnClearLogs" class="btn-clear">Bersihkan</button>
                </div>
                <div id="ffmpeg-logs" class="terminal"></div>
            </div>
        </div>
    </div>

    <script>
        const logContainer = document.getElementById('ffmpeg-logs');
        function appendLog(message) {
            logContainer.textContent += message + '\n';
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        let ffmpeg = null;
        let isCoreLoaded = false;
        const libBasePath = './lib'; 

        const statusLabel = document.getElementById('status');
        const libBadge = document.getElementById('lib-status-badge');
        const btnProcess = document.getElementById('btnProcess');
        const uploader = document.getElementById('uploader');
        const fileNameLabel = document.getElementById('file-name-label');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');

        function getAbsoluteURL(relativePath) {
            return new URL(relativePath, window.location.href).href;
        }

        // SOLUSI JITU: Bypass Cloudflare CORP dengan mendownload ke memori (Blob)
        async function fetchToBlobURL(url, mimeType) {
            appendLog(`[RAM] Mengunduh: ${url.split('/').pop()}...`);
            const response = await fetch(url);
            if (!response.ok) throw new Error(`Gagal mengunduh ${url} (HTTP ${response.status})`);
            const buffer = await response.arrayBuffer();
            const blob = new Blob([buffer], { type: mimeType });
            return URL.createObjectURL(blob);
        }

        async function customFetchFile(file) {
            if (typeof file === 'string') {
                const response = await fetch(file);
                return new Uint8Array(await response.arrayBuffer());
            }
            if (file instanceof File || file instanceof Blob) {
                return new Uint8Array(await file.arrayBuffer());
            }
            return file;
        }

        function initFFmpeg() {
            appendLog('Memulai inisialisasi FFmpeg v0.12...');
            const lib = window.FFmpegWASM;

            if (lib && lib.FFmpeg) {
                try {
                    ffmpeg = new lib.FFmpeg();

                    ffmpeg.on('log', ({ message }) => {
                        appendLog(`[FFmpeg] ${message}`);
                    });

                    ffmpeg.on('progress', ({ progress }) => {
                        const percent = Math.round(progress * 100);
                        statusLabel.innerText = `Memproses video: ${percent}% selesai...`;
                        progressBar.style.width = `${percent}%`;
                    });

                    libBadge.className = "badge ready";
                    libBadge.innerText = "Siap (v0.12)";
                    statusLabel.innerText = "Silakan pilih video untuk memulai.";
                    appendLog('✅ [Sistem] FFmpeg siap beroperasi!');
                } catch (err) {
                    libBadge.className = "badge failed";
                    libBadge.innerText = "Gagal";
                    appendLog('❌ [Error] ' + err.message);
                }
            } else {
                libBadge.className = "badge failed";
                libBadge.innerText = "Gagal Memuat";
                appendLog('❌ Error: Objek FFmpeg tidak ditemukan.');
            }
        }

        window.addEventListener('load', initFFmpeg);

        uploader.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                fileNameLabel.innerText = file.name;
                btnProcess.disabled = false;
                statusLabel.innerText = `File "${file.name}" siap diproses.`;
                progressContainer.style.display = 'none';
                progressBar.style.width = '0%';
            }
        });

        document.getElementById('btnClearLogs').addEventListener('click', () => {
            logContainer.textContent = '';
        });

        btnProcess.addEventListener('click', async () => {
            const file = uploader.files[0];
            if (!file || !ffmpeg) return;

            btnProcess.disabled = true;
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';

            try {
                if (!isCoreLoaded) {
                    statusLabel.innerText = 'Mengunduh pustaka ke memori...';
                    
                    // KONFIGURASI SOLUSI FINAL & MUTLAK:
                    // Kita mendownload ketiga file ke memori Blob URL.
                    // Ini membypass pemblokiran keamanan Chromium sepenuhnya.
                    const coreURL = await fetchToBlobURL(getAbsoluteURL(`${libBasePath}/ffmpeg-core.js`), 'text/javascript');
                    const wasmURL = await fetchToBlobURL(getAbsoluteURL(`${libBasePath}/ffmpeg-core.wasm`), 'application/wasm');
                    const classWorkerURL = await fetchToBlobURL(getAbsoluteURL(`${libBasePath}/814.ffmpeg.js`), 'text/javascript');
                    
                    // KITA TIDAK MENYERTAKAN workerURL agar FFmpeg tidak kebingungan!
                    const loadConfig = {
                        coreURL: coreURL,
                        wasmURL: wasmURL,
                        classWorkerURL: classWorkerURL
                    };
                    
                    appendLog('[Sistem] Mengeksekusi ffmpeg.load() dari memori...');
                    await ffmpeg.load(loadConfig);
                    
                    isCoreLoaded = true;
                    appendLog('🎉 [Sistem] WASM Engine berhasil menyala tanpa error!');
                }

                const inputName = file.name;
                const outputName = 'converted_' + Date.now() + '.mp4';
                
                statusLabel.innerText = 'Membaca video ke memori...';
                const fileData = await customFetchFile(file);
                await ffmpeg.writeFile(inputName, fileData);

                statusLabel.innerText = 'Memulai proses konversi...';
                appendLog(`[Konversi] ffmpeg -i "${inputName}" -c:v libx264 -preset ultrafast -crf 28 "${outputName}"`);
                
                await ffmpeg.exec(['-i', inputName, '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '28', outputName]);

                statusLabel.innerText = 'Menyelesaikan file hasil...';
                const data = await ffmpeg.readFile(outputName);

                const blob = new Blob([data.buffer], { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(blob);

                const outputVideo = document.getElementById('output-video');
                const outputContainer = document.getElementById('output-container');
                const btnDownload = document.getElementById('btnDownload');

                outputVideo.src = videoUrl;
                btnDownload.href = videoUrl;
                btnDownload.download = 'converted_' + inputName.substring(0, inputName.lastIndexOf('.')) + '.mp4';
                
                outputContainer.style.display = 'block';
                statusLabel.innerText = 'Konversi Berhasil!';
                progressBar.style.width = '100%';
                appendLog('✅ [Sukses] Proses konversi video selesai!');

                await ffmpeg.deleteFile(inputName);
                await ffmpeg.deleteFile(outputName);

            } catch (error) {
                statusLabel.innerText = 'Gagal memproses video!';
                appendLog(`❌ [Error] ${error.message || error}`);
            } finally {
                btnProcess.disabled = false;
            }
        });
    </script>
</body>
</html>
