<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCodecs GPU Telemetry</title>
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; margin: 0; }
        .container { background-color: #1e293b; border: 1px solid #334155; border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); width: 100%; max-width: 42rem; padding: 1.5rem; box-sizing: border-box; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
        .title { font-size: 1.5rem; font-weight: 800; margin: 0; background: linear-gradient(to right, #f59e0b, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .badge { font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.75rem; border-radius: 9999px; background-color: rgba(245, 158, 11, 0.1); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); }
        .dropzone { border: 2px dashed #475569; border-radius: 0.75rem; padding: 1.5rem; text-align: center; position: relative; cursor: pointer; transition: border-color 0.2s; margin-bottom: 1rem; }
        .dropzone:hover { border-color: #f59e0b; }
        .dropzone input[type="file"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        .render-monitor { position: relative; width: 100%; aspect-ratio: 16/9; background-color: #000; border-radius: 0.75rem; overflow: hidden; display: none; margin-bottom: 1rem; border: 1px solid #334155; }
        .render-monitor canvas { width: 100%; height: 100%; object-fit: cover; }
        .monitor-overlay { position: absolute; top: 10px; right: 10px; background-color: rgba(239, 68, 68, 0.9); color: white; font-size: 0.7rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; animation: blink 1s infinite; font-family: monospace;}
        @keyframes blink { 50% { opacity: 0.3; } }

        .btn { width: 100%; padding: 0.75rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 600; border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; margin-top: 0.5rem; }
        .btn:disabled { background-color: #334155; color: #64748b; cursor: not-allowed; }
        .btn-primary { background-color: #ea580c; color: #ffffff; }
        .btn-primary:hover:not(:disabled) { background-color: #c2410c; }
        
        .status-text { text-align: center; font-size: 0.875rem; color: #94a3b8; margin: 1rem 0; font-weight: bold; }
        .progress-container { width: 100%; background-color: #334155; border-radius: 9999px; height: 0.625rem; overflow: hidden; display: none; margin-bottom: 1rem; }
        .progress-bar { background-color: #f59e0b; height: 100%; width: 0%; transition: width 0.1s linear; }
        
        /* Terminal diperbesar agar log terbaca jelas */
        .terminal { height: 18rem; background-color: #020617; border: 1px solid #1e293b; border-radius: 0.75rem; padding: 0.75rem; font-family: monospace; font-size: 0.7rem; color: #fbbf24; overflow-y: auto; white-space: pre-wrap; line-height: 1.4;}
        .log-warn { color: #f87171; }
        .log-good { color: #34d399; }
    </style>
    
    <script src="https://unpkg.com/mp4-muxer/build/mp4-muxer.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">GPU Telemetry</h1>
            <span id="badge" class="badge">Hardware Accel: ON</span>
        </div>

        <div class="dropzone">
            <div class="text-main"><span id="file-name-label" style="font-weight: 600; color: #f59e0b;">Pilih file video</span></div>
            <p class="text-sub" style="font-size: 0.75rem; color: #64748b;">(Video Only) Upscale 1080p & Upframe 60 FPS via GPU</p>
            <input type="file" id="uploader" accept="video/*">
        </div>

        <div id="render-monitor" class="render-monitor">
            <canvas id="gpu-canvas" width="1920" height="1080"></canvas>
            <div class="monitor-overlay">GPU RENDERING</div>
        </div>

        <button id="btnProcess" disabled class="btn btn-primary">Mulai Eksekusi & Profiling</button>

        <div id="status" class="status-text">Siap memproses.</div>
        <div id="progress-container" class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <h3 style="font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 0.5rem;">Diagnostic Log (Per 60 Frame)</h3>
        <div id="logs" class="terminal">Menunggu instruksi...</div>
    </div>

   <script>
        const logContainer = document.getElementById('logs');
        const canvas = document.getElementById('gpu-canvas');
        const ctx = canvas.getContext('2d', { alpha: false, willReadFrequently: true });
        
        function log(msg, type = '') {
            let colorClass = '';
            if (type === 'warn') colorClass = 'log-warn';
            if (type === 'good') colorClass = 'log-good';
            
            const span = document.createElement('span');
            span.className = colorClass;
            span.innerText = msg + '\n';
            logContainer.appendChild(span);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        if (!('VideoEncoder' in window)) {
            log("❌ ERROR: Browser Anda tidak mendukung WebCodecs API.", "warn");
            document.getElementById('btnProcess').style.display = 'none';
        } else {
            log("✅ Sistem Hardware (WebCodecs) terdeteksi dan siap.", "good");
        }

        let sourceVideo = document.createElement('video');
        let fileDuration = 0;

        document.getElementById('uploader').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('file-name-label').innerText = file.name;
                document.getElementById('btnProcess').disabled = false;
                
                sourceVideo.src = URL.createObjectURL(file);
                sourceVideo.onloadedmetadata = () => {
                    fileDuration = sourceVideo.duration;
                    log(`[Info] File termuat. Durasi: ${fileDuration.toFixed(2)} detik`);
                };
            }
        });

        document.getElementById('btnProcess').addEventListener('click', async () => {
            document.getElementById('btnProcess').disabled = true;
            document.getElementById('progress-container').style.display = 'block';
            document.getElementById('render-monitor').style.display = 'block';
            
            const targetFPS = 60;
            const targetWidth = 1920;
            const targetHeight = 1080;
            const frameDurationSec = 1 / targetFPS;
            
            log("🚀 Membangun Pipeline MP4-Muxer...");
            let muxer = new Mp4Muxer.Muxer({
                target: new Mp4Muxer.ArrayBufferTarget(),
                video: { codec: 'avc', width: targetWidth, height: targetHeight },
                fastStart: 'in-memory'
            });

            log("⚡ Menghidupkan GPU VideoEncoder...");
            let encoder = new VideoEncoder({
                output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
                error: (e) => log(`❌ Encoder Error: ${e.message}`, "warn")
            });

            encoder.configure({
                codec: 'avc1.4D002A', 
                width: targetWidth,
                height: targetHeight,
                hardwareAcceleration: 'prefer-hardware',
                bitrate: 5_000_000,
                framerate: targetFPS
            });

            log(`⚙️ GPU Pipeline Siap. Memulai ekstraksi frame...\n---------------------------------`);
            
            // VARIABEL TELEMETRI
            let frameCount = 0;
            let sumSeekTime = 0;
            let sumDrawTime = 0;
            let sumEncodeTime = 0;
            
            const totalStartTime = performance.now();
            let currentTime = 0;
            let seekTimerStart = performance.now();
            
            // FUNGSI INTI DIPISAH AGAR BISA DIPANCING MANUAL
            const processFrame = async function() {
                // 1. Catat waktu Seek (Bottleneck DOM)
                const seekTime = performance.now() - seekTimerStart;
                sumSeekTime += seekTime;

                // 2. Lukis dan catat waktu Upscale GPU
                const drawTimerStart = performance.now();
                ctx.drawImage(sourceVideo, 0, 0, targetWidth, targetHeight);
                const drawTime = performance.now() - drawTimerStart;
                sumDrawTime += drawTime;
                
                // 3. Encode dan catat waktu Feed GPU
                const encodeTimerStart = performance.now();
                const frame = new VideoFrame(canvas, { timestamp: currentTime * 1_000_000 });
                encoder.encode(frame, { keyFrame: (frameCount % 60 === 0) });
                frame.close();
                const encodeTime = performance.now() - encodeTimerStart;
                sumEncodeTime += encodeTime;

                frameCount++;

                // REPORTING SETIAP 60 FRAME
                if (frameCount % 60 === 0) {
                    const avgSeek = (sumSeekTime / 60).toFixed(2);
                    const avgDraw = (sumDrawTime / 60).toFixed(2);
                    const avgEncode = (sumEncodeTime / 60).toFixed(2);
                    
                    let report = `[Frame ${frameCount}] Metrik Rata-rata:\n`;
                    if (avgSeek > 10) {
                        report += `  🔴 DOM Seek : ${avgSeek} ms (BOTTLENECK!)\n`;
                    } else {
                        report += `  🟢 DOM Seek : ${avgSeek} ms\n`;
                    }
                    report += `  🟢 GPU Draw : ${avgDraw} ms\n`;
                    report += `  🟢 GPU Enc  : ${avgEncode} ms\n`;
                    log(report);
                    
                    sumSeekTime = 0; sumDrawTime = 0; sumEncodeTime = 0;
                }

                // Hitung Progress UI
                const percent = Math.min(100, Math.round((currentTime / fileDuration) * 100));
                document.getElementById('status').innerText = `Memproses: ${percent}%...`;
                document.getElementById('progress-bar').style.width = `${percent}%`;

                // NEXT FRAME
                currentTime += frameDurationSec;
                if (currentTime <= fileDuration) {
                    seekTimerStart = performance.now();
                    sourceVideo.currentTime = currentTime; // Memicu event untuk frame ke-2 dan seterusnya
                } else {
                    sourceVideo.removeEventListener('seeked', processFrame);
                    log(`\n✅ Ekstraksi selesai. Melakukan finalisasi muxer...`);
                    
                    await encoder.flush();
                    muxer.finalize();
                    
                    const { buffer } = muxer.target;
                    const blob = new Blob([buffer], { type: 'video/mp4' });
                    const url = URL.createObjectURL(blob);
                    
                    const totalEndTime = performance.now();
                    log(`🎉 EKSEKUSI SELESAI TOTAL: ${((totalEndTime - totalStartTime) / 1000).toFixed(2)} detik!`, "good");
                    document.getElementById('status').innerText = 'Selesai! Mengunduh otomatis...';

                    const a = document.createElement('a');
                    a.href = url;
                    a.download = "output_gpu_telemetry.mp4";
                    a.click();
                    
                    document.getElementById('btnProcess').disabled = false;
                }
            };

            // Pasang event listener untuk frame ke-2 hingga selesai
            sourceVideo.addEventListener('seeked', processFrame);
            
            // PANCING FRAME PERTAMA SECARA MANUAL
            processFrame();
        });
    </script>
</body>
</html>
