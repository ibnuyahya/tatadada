<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid Engine Pro: Perfect Sync</title>
    <style>
        body { background-color: #0f172a; color: #f1f5f9; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; margin: 0; }
        .container { background-color: #1e293b; border: 1px solid #334155; border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); width: 100%; max-width: 48rem; padding: 1.5rem; box-sizing: border-box; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
        .title { font-size: 1.5rem; font-weight: 800; margin: 0; background: linear-gradient(to right, #10b981, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .badge { font-size: 0.75rem; font-weight: 600; padding: 0.25rem 0.75rem; border-radius: 9999px; background-color: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .dropzone { border: 2px dashed #475569; border-radius: 0.75rem; padding: 1.5rem; text-align: center; position: relative; cursor: pointer; transition: border-color 0.2s; margin-bottom: 1rem; }
        .dropzone:hover { border-color: #10b981; }
        .dropzone input[type="file"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        
        .controls { display: flex; gap: 1rem; margin-bottom: 1rem; background-color: #0f172a; padding: 1rem; border-radius: 0.75rem; border: 1px solid #334155; }
        .toggle-group { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: #cbd5e1; cursor: pointer; flex: 1;}
        .toggle-group input[type="checkbox"] { width: 1.25rem; height: 1.25rem; cursor: pointer; accent-color: #10b981; }
        
        .render-monitor { position: relative; width: 100%; aspect-ratio: 16/9; background-color: #000; border-radius: 0.75rem; overflow: hidden; display: none; margin-bottom: 1rem; border: 1px solid #334155; }
        .render-monitor canvas { width: 100%; height: 100%; object-fit: cover; }
        .monitor-overlay { position: absolute; top: 10px; right: 10px; background-color: rgba(16, 185, 129, 0.9); color: white; font-size: 0.7rem; font-weight: bold; padding: 4px 8px; border-radius: 4px; font-family: monospace;}
        
        .btn { width: 100%; padding: 0.75rem; border-radius: 0.75rem; font-size: 0.875rem; font-weight: 600; border: none; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; margin-top: 0.5rem; }
        .btn:disabled { background-color: #334155; color: #64748b; cursor: not-allowed; }
        .btn-primary { background-color: #059669; color: #ffffff; }
        .btn-primary:hover:not(:disabled) { background-color: #047857; }
        
        .status-text { text-align: center; font-size: 0.875rem; color: #94a3b8; margin: 1rem 0; font-weight: bold; }
        .progress-container { width: 100%; background-color: #334155; border-radius: 9999px; height: 0.625rem; overflow: hidden; display: none; margin-bottom: 1rem; }
        .progress-bar { background-color: #10b981; height: 100%; width: 0%; transition: width 0.1s linear; }
        
        .terminal { height: 16rem; background-color: #020617; border: 1px solid #1e293b; border-radius: 0.75rem; padding: 0.75rem; font-family: monospace; font-size: 0.7rem; color: #e2e8f0; overflow-y: auto; white-space: pre-wrap; line-height: 1.4;}
        .log-warn { color: #f87171; }
        .log-good { color: #34d399; }
        .log-hl { color: #38bdf8; }
        .log-meta { color: #818cf8; }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
    <script src="https://unpkg.com/mp4-muxer/build/mp4-muxer.js"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Hybrid Pro (Perfect Sync)</h1>
            <span id="badge" class="badge">Offscreen Canvas + Strict CFR</span>
        </div>

        <div class="dropzone">
            <div class="text-main"><span id="file-name-label" style="font-weight: 600; color: #10b981;">Pilih file video MP4</span></div>
            <p class="text-sub" style="font-size: 0.75rem; color: #64748b;">Mengeksekusi konversi stabil tanpa drop frame.</p>
            <input type="file" id="uploader" accept="video/mp4">
        </div>

        <div class="controls">
            <label class="toggle-group">
                <input type="checkbox" id="toggle-res">
                <span>Upscale Paksa ke 1080p<br><small style="color:#64748b">(Default: Resolusi Asli)</small></span>
            </label>
            <label class="toggle-group">
                <input type="checkbox" id="toggle-fps">
                <span>Upframe Paksa ke 60 FPS<br><small style="color:#64748b">(Default: FPS Asli)</small></span>
            </label>
        </div>

        <div id="render-monitor" class="render-monitor">
            <canvas id="gpu-canvas"></canvas>
            <div class="monitor-overlay">UI THROTTLED (30FPS)</div>
        </div>

        <button id="btnProcess" disabled class="btn btn-primary">Mulai Eksekusi Pipeline</button>

        <div id="status" class="status-text">Menunggu instruksi...</div>
        <div id="progress-container" class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <h3 style="font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 0.5rem;">Log Diagnostik</h3>
        <div id="logs" class="terminal">Sistem siap...</div>
    </div>

    <script>
        const { FFmpeg } = window.FFmpegWASM;
        const { fetchFile, toBlobURL } = window.FFmpegUtil;

        const logContainer = document.getElementById('logs');
        const uiCanvas = document.getElementById('gpu-canvas');
        const uiCtx = uiCanvas.getContext('2d', { alpha: false }); 
        
        function log(msg, type = '') {
            const span = document.createElement('span');
            span.className = type ? `log-${type}` : '';
            span.innerText = msg + '\n';
            logContainer.appendChild(span);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        let selectedFile = null;

        document.getElementById('uploader').addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                document.getElementById('file-name-label').innerText = selectedFile.name;
                document.getElementById('btnProcess').disabled = false;
                log(`[Sistem] File siap: ${selectedFile.name}`, "good");
            }
        });

        document.getElementById('btnProcess').addEventListener('click', async () => {
            document.getElementById('btnProcess').disabled = true;
            document.getElementById('progress-container').style.display = 'block';
            document.getElementById('render-monitor').style.display = 'block';
            
            const totalStartTime = performance.now();
            log("🚀 [FASE 1] Menyalakan WebCodecs GPU (Sequential Mode)...", "hl");

            let muxer, encoder, decoder;
            let totalSamples = 0;
            let samplesProcessed = 0;
            
            const mp4boxfile = MP4Box.createFile();
            let videoTrackId = null;

            // ANTREAN DATA SEKUENSIAL (Mengatasi Bug H.264 Out-of-Order)
            const sampleQueue = [];
            let isFileReadComplete = false;

            mp4boxfile.onReady = (info) => {
                const track = info.videoTracks[0];
                videoTrackId = track.id;
                totalSamples = track.nb_samples;
                
                // Ambil FPS presisi tinggi dari DNA Video (CFR murni)
                const exactOrigFPS = track.nb_samples / (info.duration / info.timescale);
                log(`[Deteksi] Resolusi: ${track.video.width}x${track.video.height} | FPS Asli: ${exactOrigFPS.toFixed(3)}`, "meta");

                const forceUpscale = document.getElementById('toggle-res').checked;
                const forceUpframe = document.getElementById('toggle-fps').checked;

                const targetWidth = forceUpscale ? 1920 : track.video.width;
                const targetHeight = forceUpscale ? 1080 : track.video.height;
                let targetFPS = forceUpframe ? 60 : exactOrigFPS;
                if (forceUpframe && exactOrigFPS >= 60) targetFPS = exactOrigFPS;

                const fpsMultiplier = (forceUpframe && exactOrigFPS < 60) ? Math.round(60 / exactOrigFPS) : 1;
                const frameDurationUs = 1_000_000 / targetFPS; // Waktu Absolut per Bingkai
                
                log(`[Config] Target Render: ${targetWidth}x${targetHeight} @ ${targetFPS.toFixed(2)} FPS`, "hl");
                
                uiCanvas.width = targetWidth; 
                uiCanvas.height = targetHeight;

                // KANVAS BAYANGAN (Memutus ikatan VRAM dari lambatnya UI/DOM)
                const offscreenCanvas = new OffscreenCanvas(targetWidth, targetHeight);
                const offCtx = offscreenCanvas.getContext('2d', { alpha: false });

                muxer = new Mp4Muxer.Muxer({
                    target: new Mp4Muxer.ArrayBufferTarget(),
                    video: { codec: 'avc', width: targetWidth, height: targetHeight },
                    fastStart: 'in-memory'
                });

                encoder = new VideoEncoder({
                    output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
                    error: (e) => log(`❌ Encoder Error: ${e.message}`, "warn")
                });
                
                encoder.configure({ 
                    codec: 'avc1.4D002A', 
                    width: targetWidth, 
                    height: targetHeight, 
                    hardwareAcceleration: 'prefer-hardware', 
                    bitrate: 5_000_000, 
                    framerate: Math.round(targetFPS) 
                });

                let framesDecoded = 0;
                let framesEncoded = 0;
                let lastUiDraw = 0; // Throttle UI

                decoder = new VideoDecoder({
                    output: (frame) => {
                        // 1. Gambar ke Kanvas Bayangan di Belakang Layar (Cepat, Bebas Lag DOM)
                        offCtx.drawImage(frame, 0, 0, targetWidth, targetHeight);

                        // 2. Throttle UI: Sesekali saja gambar dikirim ke layar monitor agar tidak tearing
                        const now = performance.now();
                        if (now - lastUiDraw > 33.3) {
                            uiCtx.drawImage(frame, 0, 0, targetWidth, targetHeight);
                            lastUiDraw = now;
                        }

                        // 3. Gandakan Bingkai (Jika Perlu) & Jahit Stempel Waktu (CFR Murni)
                        for (let i = 0; i < fpsMultiplier; i++) {
                            const syntheticTs = Math.round(framesEncoded * frameDurationUs); // Absolute Timing

                            const newFrame = new VideoFrame(offscreenCanvas, { timestamp: syntheticTs });
                            
                            // Paksa Keyframe tiap detik untuk menjaga ukuran dan kestabilan
                            encoder.encode(newFrame, { keyFrame: (framesEncoded % Math.round(targetFPS) === 0) });
                            newFrame.close();
                            framesEncoded++;
                        }
                        
                        frame.close(); 
                        framesDecoded++;

                        if (framesDecoded % 60 === 0) {
                            const percent = Math.round((framesDecoded / totalSamples) * 100);
                            document.getElementById('status').innerText = `[GPU] Rendering: ${percent}%`;
                            document.getElementById('progress-bar').style.width = `${percent}%`;
                        }
                    },
                    error: (e) => log(`❌ Decoder Error: ${e.message}`, "warn")
                });

                let description = null;
                const trak = mp4boxfile.getTrackById(videoTrackId);
                for (const entry of trak.mdia.minf.stbl.stsd.entries) {
                    if (entry.avcC) {
                        const stream = new DataStream(undefined, 0, DataStream.BIG_ENDIAN);
                        entry.avcC.write(stream);
                        description = new Uint8Array(stream.buffer, 8); 
                        break;
                    }
                }

                decoder.configure({
                    codec: track.codec, codedWidth: track.video.width, codedHeight: track.video.height,
                    description: description, hardwareAcceleration: 'prefer-hardware'
                });

                mp4boxfile.setExtractionOptions(videoTrackId);
                mp4boxfile.start();
            };

            // TANGKAP SAMPEL SECARA SINKRONUS (Jangan dieksekusi dulu agar tidak balapan)
            mp4boxfile.onSamples = (id, user, samples) => {
                for (const sample of samples) {
                    sampleQueue.push(sample);
                }
            };

            // FUNGSI PEKERJA SEKUENSIAL (Menjamin urutan H.264 tidak rusak)
            const processQueue = async () => {
                while (!isFileReadComplete || sampleQueue.length > 0) {
                    if (sampleQueue.length === 0) {
                        await new Promise(r => setTimeout(r, 10)); // Tunggu data baru
                        continue;
                    }

                    // Tahan pintu air agar VRAM GPU tidak jebol
                    while ((decoder && decoder.decodeQueueSize >= 10) || (encoder && encoder.encodeQueueSize >= 15)) {
                        await new Promise(r => setTimeout(r, 2));
                    }

                    const sample = sampleQueue.shift();
                    const chunk = new EncodedVideoChunk({
                        type: sample.is_sync ? 'key' : 'delta',
                        timestamp: 1e6 * sample.cts / sample.timescale,
                        duration: 1e6 * sample.duration / sample.timescale,
                        data: sample.data
                    });
                    
                    decoder.decode(chunk);
                    samplesProcessed++;
                }
            };

            log("⏳ Membaca file dan memulai antrean sekuensial...");
            const reader = new FileReader();
            reader.onload = async (e) => {
                const buffer = e.target.result;
                buffer.fileStart = 0;
                
                // Memicu parser. Ini akan mengisi sampleQueue dengan sangat cepat.
                mp4boxfile.appendBuffer(buffer);
                mp4boxfile.flush();
                isFileReadComplete = true; // Tandai bahwa tidak ada lagi data yang akan masuk ke antrean
                
                // Tunggu mesin pekerja menyelesaikan seluruh isi antrean satu per satu
                await processQueue();
                
                // Tunggu hingga antrean di dalam VRAM GPU benar-benar habis
                await decoder.flush();
                await encoder.flush();
                muxer.finalize();
                
                // BERSILAN BEKAS VRAM AGAR TIDAK TERJADI "CODEC RECLAIMED"
                decoder.close();
                encoder.close();

                const { buffer: gpuVideoBuffer } = muxer.target;
                log("✅ [FASE 1 SELESAI] VRAM sukses mencetak gambar dengan CFR murni.", "good");
                document.getElementById('render-monitor').style.display = 'none';

                // ==========================================
                // FASE 2: CPU FFMPEG WASM (MENJAHIT AUDIO)
                // ==========================================
                document.getElementById('status').innerText = `[CPU] Melakukan Muxing Audio...`;
                document.getElementById('progress-bar').style.width = `100%`;
                document.getElementById('progress-bar').style.backgroundColor = `#3b82f6`;
                
                log("\n🚀 [FASE 2] Menjahit Audio Asli via FFmpeg WASM...", "hl");

                const ffmpeg = new FFmpeg();
                ffmpeg.on('log', ({ message }) => {
                    if (message.includes('frame=') || message.includes('bitrate=')) return; 
                    log(`[FFmpeg] ${message}`, 'meta');
                });

                const localBaseURL = 'https://danial.my.id/simplevideo/lib/simd';
                const classWorkerURL = await toBlobURL('https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js', 'text/javascript');

                await ffmpeg.load({
                    coreURL: `${localBaseURL}/ffmpeg-core.js`,
                    wasmURL: `${localBaseURL}/ffmpeg-core.wasm`,
                    workerURL: `${localBaseURL}/ffmpeg-core.worker.js`,
                    classWorkerURL: classWorkerURL
                });

                await ffmpeg.writeFile('original.mp4', await fetchFile(selectedFile));
                await ffmpeg.writeFile('gpu_video.mp4', await fetchFile(new Blob([gpuVideoBuffer])));

                document.getElementById('status').innerText = `[Muxing] Menyelesaikan Berkas...`;

                await ffmpeg.exec([
                    '-i', 'gpu_video.mp4', 
                    '-i', 'original.mp4', 
                    '-map', '0:v:0',      
                    '-map', '1:a:0?',     
                    '-c:v', 'copy', 
                    '-c:a', 'aac',  
                    '-shortest',          
                    'final_output.mp4'
                ]);

                log("✅ [FASE 2 SELESAI] Penjahitan audio selesai!", "good");

                const finalData = await ffmpeg.readFile('final_output.mp4');
                const finalBlob = new Blob([finalData.buffer], { type: 'video/mp4' });
                const finalUrl = URL.createObjectURL(finalBlob);
                
                const totalEndTime = performance.now();
                log(`\n🎉 SELESAI TOTAL! Waktu komputasi: ${((totalEndTime - totalStartTime) / 1000).toFixed(2)} detik!`, "good");
                
                document.getElementById('status').innerText = 'Video siap ditonton!';
                document.getElementById('progress-bar').style.backgroundColor = `#10b981`;

                const a = document.createElement('a');
                a.href = finalUrl;
                a.download = "Output_Pro_PerfectSync.mp4";
                a.click();
                
                document.getElementById('btnProcess').disabled = false;
            };
            reader.readAsArrayBuffer(selectedFile);
        });
    </script>
</body>
</html>
